name: Branch build

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create the draft release

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build app
        run: ./gradlew assembleRelease -Pdist=ci -Penable-updater=false

      # The Qualcomm NPU backend needs the QAIRT SDK headers at compile time and 15 model files that are not in Git.
      # Both ship in the upstream release APK, so graft them onto our build (see tools/ci/graft_npu.py).
      - name: Download upstream release APK
        env:
          UPSTREAM_TAG: v1.3.16
        run: |
          curl -fsSL -o upstream.apk \
            "https://github.com/HaoweiLi97/mihon_img_upscale/releases/download/${UPSTREAM_TAG}/app-arm64-v8a-release.apk"

      - name: Graft NPU parts, align and sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 tools/ci/graft_npu.py app/build/outputs/apk/release/app-arm64-v8a-release.apk upstream.apk grafted.apk
          "$BT/zipalign" -p -f 4 grafted.apk aligned.apk
          "$BT/apksigner" sign --ks tools/ci/ci-signing.keystore --ks-pass pass:android --key-pass pass:android \
            --out app-arm64-v8a-npu.apk aligned.apk
          "$BT/apksigner" verify --print-certs app-arm64-v8a-npu.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-v8a-npu-${{ github.sha }}
          path: app-arm64-v8a-npu.apk

      # Draft: only repository collaborators can see it. Publish it from the Releases page to make it public.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" app-arm64-v8a-npu.apk \
            --draft --prerelease --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }} (${GITHUB_SHA::7})" \
            --notes "Branch ${{ github.ref_name }}, commit ${{ github.sha }}. Qualcomm NPU backend and models grafted from upstream v1.3.16 (see tools/ci/graft_npu.py)."
